<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat2Excel - AI数据分析助手</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Chat2Excel</h1>
            <p class="subtitle">基于AI的Excel数据分析助手，上传您的Excel文件，即可获得智能化的数据分析和建议</p>
        </header>

        <div class="file-upload-section">
            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">
            <button class="file-btn" id="selectFileBtn">选择文件</button>
            <input type="text" id="filePath" class="file-path-input" readonly placeholder="请选择.xlsx格式的Excel文件">
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="messages-area" id="messagesArea">
                <div class="welcome-message">
                    <div class="welcome-icon">📊</div>
                    <h2>欢迎使用 Chat2Excel</h2>
                    <p>上传Excel文件并提问，AI将为您提供专业的数据分析</p>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)"
                    maxlength="2000"
                ></textarea>
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L2 9L22 2ZM22 2L15 22L11 13L22 2Z"/>
                    </svg>
                </button>
            </div>
            <div class="char-counter">
                <span id="charCount">0</span>/2000
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
